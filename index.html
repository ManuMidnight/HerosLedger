<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>D&D Taverna - Hero's Ledger</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="D&D Taverna">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/149/149071.png">
    <meta name="theme-color" content="#3e2723">

    <style>
        :root { --wood: #3e2723; --stone: #424242; --amber: #ffca28; --gold: #b8860b; --parchment: #f5e1b6; }
        /* FIX: Impedisce il pull-to-refresh e blocca lo scroll indesiderato */
        body { font-family: 'Georgia', serif; background-color: var(--wood); color: #d7ccc8; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; overscroll-behavior-y: none; }
        
        .login-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; overflow-y: auto; }
        .scroll-box { background: #212121; padding: 20px; border: 4px solid var(--stone); border-radius: 8px; width: 85%; max-width: 350px; text-align: center; margin: 20px; }
        input, select { background: #424242; color: white; border: 1px solid #757575; padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; font-size: 16px; border-radius: 4px; }
        #game-ui { display: none; flex-direction: column; height: 100vh; }
        header { background: var(--stone); color: var(--amber); padding: 8px; text-align: center; border-bottom: 2px solid var(--gold); position: relative; }
        .exit-btn { position: absolute; left: 10px; top: 8px; background: #b71c1c; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; }
        
        .vault-container { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; margin-bottom: 10px; border-bottom: 1px solid #444; }
        .vault-card { flex-shrink: 0; width: 60px; text-align: center; cursor: pointer; position: relative; }
        .vault-card img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; }
        .vault-card div { font-size: 0.6rem; color: var(--amber); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .del-vault { position: absolute; top: -5px; right: 5px; background: #b71c1c; color: white; border-radius: 50%; width: 16px; height: 16px; font-size: 12px; line-height: 16px; text-align: center; border: 1px solid var(--gold); z-index: 5; }

        .settings-btn { position: absolute; right: 10px; top: 8px; background: none; border: none; color: var(--amber); font-size: 1.2rem; cursor: pointer; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 200; }
        .modal-content { background: #212121; padding: 20px; border-radius: 8px; border: 2px solid var(--gold); width: 300px; max-height: 90vh; overflow-y: auto; }
        
        #party-bar { display: flex; gap: 10px; padding: 10px; background: rgba(0,0,0,0.6); overflow-x: auto; min-height: 70px; align-items: center; }
        .pg-tag { background: var(--parchment); color: #3e2723; border: 2px solid var(--gold); padding: 5px 10px; border-radius: 5px; min-width: 140px; display: flex; align-items: center; gap: 8px; position: relative; flex-shrink: 0; }
        .npc-tag { border-color: #b71c1c; background: #ef9a9a; }
        
        .boss-tag { border: 3px solid #ffd700 !important; background: linear-gradient(135deg, #fff3b0 0%, #f5e1b6 50%, #fff3b0 100%); box-shadow: 0 0 10px #ffca28; animation: boss-shine 3s infinite; }
        @keyframes boss-shine { 0% { filter: brightness(1); } 50% { filter: brightness(1.2); } 100% { filter: brightness(1); } }

        .avatar-container { position: relative; width: 35px; height: 35px; }
        .avatar-circle { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; transition: filter 0.3s; }
        .hp-overlay { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; mix-blend-mode: multiply; }
        
        /* FIX: Scroll fluido e senza ricarica pagina */
        #chat-flow { flex: 1; overflow-y: auto; padding: 10px; background: rgba(0,0,0,0.3); overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }
        
        .chat-bubble { display: flex; gap: 8px; margin-bottom: 10px; }
        .chat-avatar { width: 30px; height: 30px; border-radius: 50%; }
        .chat-text { background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 5px; max-width: 80%; font-size: 0.9rem; border-left: 2px solid transparent; }
        .input-area { background: var(--stone); padding: 10px; border-top: 2px solid var(--gold); }
        .btn-taverna { background: var(--gold); color: black; border: none; padding: 10px; cursor: pointer; font-weight: bold; border-radius: 4px; }
        #multi-selector { background: #5d4037; padding: 10px; border: 2px solid var(--gold); margin-bottom: 8px; border-radius: 5px; display: none; max-height: 120px; overflow-y: auto; }
        
        /* FIX: Allineamento checkbox lingue */
        .check-item { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; color: white; font-size: 0.9rem; cursor: pointer; text-align: left; }
        .check-item input { width: auto; margin: 0; cursor: pointer; }

        .chat-time { font-size: 0.65rem; color: #aaa; margin-left: 5px; font-weight: normal; }
        .hidden { display: none !important; }
        .recent-rooms { margin-top: 15px; text-align: left; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 5px; border: 1px dashed var(--gold); }
        .room-chip { display: inline-block; background: var(--stone); color: var(--amber); padding: 4px 8px; margin: 4px 2px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; position: relative; }
        .del-room { position: absolute; top: -8px; right: -5px; background: #b71c1c; color: white; border-radius: 50%; width: 14px; height: 14px; font-size: 10px; line-height: 14px; text-align: center; border: 1px solid var(--gold); }
        
        .cond-badge { font-size: 0.6rem; background: #b71c1c; color: white; padding: 1px 4px; border-radius: 3px; margin-right: 2px; display: inline-block; margin-top: 2px; }
        .lang-select { background: #3e2723; color: var(--amber); border: 1px solid var(--gold); font-size: 0.7rem; padding: 2px; margin-bottom: 5px; border-radius: 4px; }

        .manage-option { display: block; background: #444; color: white; padding: 10px; margin: 5px 0; border-radius: 4px; cursor: pointer; text-align: left; border: 1px solid #666; }
        .manage-option:hover { background: #555; }
        .cond-list-item { padding: 5px; border-bottom: 1px solid #444; display: flex; justify-content: space-between; align-items: center; color: white; }
    </style>
</head>
<body>

<audio id="silent-wake-lock" loop>
    <source src="data:audio/wav;base64,UklGRigAAABXQVZRTU9O" type="audio/wav">
</audio>

<div id="login-ui" class="login-overlay">
    <div class="scroll-box">
        <h2 style="color:var(--amber);">🍷 Registro</h2>
        <div id="pg-vault" class="vault-container"></div>
        <input type="text" id="user-name" placeholder="Nome Personaggio">
        <input type="text" id="camp-code" placeholder="Codice Stanza">
        <div id="recent-box" class="recent-rooms hidden"><div id="recent-list"></div></div>
        
        <label for="user-photo" class="btn-taverna" style="display:block; margin: 5px 0; padding: 10px; background:#444; color:white; border: 1px solid #757575;">SELEZIONA FOTO</label>
        <input type="file" id="user-photo" accept="image/*" style="display:none">
        
        <select id="user-role" onchange="document.getElementById('p-extra').classList.toggle('hidden', this.value==='master')">
            <option value="player">Giocatore</option>
            <option value="master">Dungeon Master</option>
        </select>
        <div id="p-extra">
            <input type="text" id="p-race-class" placeholder="Razza e Classe">
            <div style="display:flex; gap:5px;">
                <input type="number" id="p-hp" placeholder="PF Max">
                <input type="number" id="p-ac" placeholder="CA">
            </div>
            <p style="font-size: 0.8rem; color: var(--amber); margin: 5px 0;">Linguaggi:</p>
            <div id="lang-selection" style="text-align: left; font-size: 0.8rem; height: 100px; overflow-y: auto; background: #333; padding: 10px; border: 1px solid var(--stone);"></div>
        </div>
        <button class="btn-taverna" style="width:100%; margin-top:10px;" onclick="joinGame()">ENTRA</button>
    </div>
</div>

<div id="game-ui">
    <header>
        <button class="exit-btn" onclick="exitTavern()">ESCI</button>
        <span id="display-name"></span> | <strong id="display-code"></strong>
        <span id="round-display" style="margin-left:10px; color:white; font-size:0.8rem;"></span>
        <button id="btn-settings" class="settings-btn" onclick="openSettings()">⚙️</button>
    </header>
    <div id="master-panel" class="hidden" style="padding:5px; background: #2c1d1a; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;">
        <button onclick="openSpawnModal()" class="btn-taverna">➕ PNG</button>
        <button onclick="clearChat()" class="btn-taverna" style="background:#5d4037; color:white;">🧹 PULISCI</button>
        <button onclick="openInitModal()" class="btn-taverna" style="background:red; color:white;">⚔️ INIT</button>
        <button onclick="nextRound()" id="btn-round" class="btn-taverna" style="background:var(--amber);">⌛ ROUND +1</button>
        <button onclick="endCombat()" class="btn-taverna">🏳️ FINE</button>
    </div>
    <div id="party-bar"></div>
    <div id="chat-flow"></div>
    <div class="input-area">
        <div id="master-only-ui" class="hidden">
            <select id="sender-choice" onchange="filterLangsBySender(this.value)" style="color:var(--amber); background:#222; margin-bottom:5px; font-weight:bold;">
                <option value="MASTER">Parla come: MASTER</option>
            </select>
            <select id="msg-recipient" onchange="updateWhisperUI(this.value)" style="color:white; font-size:0.8rem; margin-bottom:5px;">
                <option value="ALL">Destinatario: TUTTI</option>
                <option value="MULTI">SUSSURRO MULTIPLO</option>
            </select>
            <div id="multi-selector"></div>
        </div>
        <div id="player-whisper-ui" class="hidden">
             <select id="player-msg-recipient" style="color:var(--amber); font-size:0.8rem; width:100%; margin-bottom:5px;">
                <option value="ALL">A: TUTTI</option>
             </select>
        </div>
        <select id="current-lang" class="lang-select"></select>
        <form onsubmit="sendMsg(); return false;" style="display:flex; gap:5px; width:100%;">
            <input type="text" id="msg-input" placeholder="Scrivi qui..." autocomplete="off">
            <button type="submit" class="btn-taverna">OK</button>
        </form>
    </div>
</div>

<div id="modal-spawn" class="modal">
    <div class="modal-content">
        <h3 style="color:var(--amber); margin:0 0 10px 0;">Genera PNG</h3>
        <input type="text" id="npc-name" placeholder="Nome (es: Goblin)">
        <input type="text" id="npc-title" placeholder="Titolo (es: Sentinella)">
        
        <select id="npc-type" style="margin-bottom:10px;">
            <option value="NPC">NPC Classico</option>
            <option value="BOSS">BOSS</option>
        </select>

        <div style="display:flex; gap:5px;">
            <input type="number" id="npc-hp" placeholder="PF">
            <input type="number" id="npc-ac" placeholder="CA">
            <input type="number" id="npc-count" placeholder="Qtà" value="1">
        </div>
        <p style="font-size:0.7rem; color:var(--amber); margin:5px 0;">Lingue PNG:</p>
        <div id="npc-lang-selection" style="text-align:left; font-size:0.7rem; height:80px; overflow-y:scroll; background:#333; padding:5px; margin-bottom:10px;"></div>
        
        <label for="npc-photo" class="btn-taverna" style="display:block; text-align:center; background:#444; font-size:0.8rem; margin-bottom:10px;">CARICA FOTO PNG</label>
        <input type="file" id="npc-photo" accept="image/*" style="display:none">
        
        <div style="display:flex; gap:5px;">
            <button class="btn-taverna" style="flex:1" onclick="spawnNPC()">SPAWNA</button>
            <button class="btn-taverna" style="flex:1; background:#b71c1c; color:white;" onclick="closeSpawnModal()">ANNULLA</button>
        </div>
    </div>
</div>

<div id="modal-init" class="modal">
    <div class="modal-content">
        <h3 style="color:var(--amber); margin-top:0;">Iniziativa</h3>
        <div id="init-list-container" style="max-height: 300px; overflow-y: auto; margin-bottom: 10px;"></div>
        <button class="btn-taverna" style="width:100%;" onclick="confirmIniziativa()">⚔️ CONFERMA</button>
        <button class="btn-taverna" style="width:100%; margin-top:5px; background:#b71c1c; color:white;" onclick="document.getElementById('modal-init').style.display='none'">ANNULLA</button>
    </div>
</div>

<div id="modal-manage" class="modal">
    <div class="modal-content">
        <h3 id="manage-title" style="color:var(--amber); margin-top:0;">Gestione Personaggio</h3>
        <div id="manage-main-menu">
            <div class="manage-option" onclick="showManageAction('DANNI')">🔴 Danni</div>
            <div class="manage-option" onclick="showManageAction('GUARIGIONE')">🔵 Guarigione</div>
            <div class="manage-option" onclick="showManageAction('CONDIZIONI')">🟢 Condizioni</div>
        </div>
        <div id="manage-action-input" class="hidden">
            <input type="number" id="manage-value" placeholder="Quantità...">
            <button class="btn-taverna" style="width:100%; margin-top:5px;" onclick="applyManageAction()">APPLICA</button>
        </div>
        <div id="manage-conditions-list" class="hidden" style="text-align:left; margin-top:10px;"></div>
        <button class="btn-taverna" style="width:100%; margin-top:15px; background:#b71c1c; color:white;" onclick="closeManage()">CHIUDI</button>
    </div>
</div>

<div id="modal-settings" class="modal">
    <div class="modal-content">
        <h3 style="color:var(--amber); margin-top:0;">Aggiorna Statistiche</h3>
        <input type="number" id="set-hp" placeholder="Nuovi PF Max">
        <input type="number" id="set-ac" placeholder="Nuova CA">
        <div style="display:flex; gap:5px; margin-top:10px;">
            <button class="btn-taverna" style="flex:1" onclick="saveSettings()">SALVA</button>
            <button class="btn-taverna" style="flex:1; background:#b71c1c; color:white;" onclick="closeSettings()">ANNULLA</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAm1BSUhkG5xylPVchP9tDsWfLXtR6-PdM",
        authDomain: "hero-s-ledger-99340.firebaseapp.com",
        databaseURL: "https://hero-s-ledger-99340-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "hero-s-ledger-99340",
        storageBucket: "hero-s-ledger-99340.firebasestorage.app",
        messagingSenderId: "745733175125",
        appId: "1:745733175125:web:12a62b5dc3fe53cba0a1dc"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let campaignRef, me = { name: "", role: "", photo: "https://cdn-icons-png.flaticon.com/512/149/149071.png", hp: 10, hpMax: 10, ac: 10, info: "", langs: ["Comune"] };
    let firstLoad = true;
    let currentTargetPG = null;
    let npcTempPhoto = null;
    let cachedNPCs = {};
    let currentRound = 0;

    const ALL_LANGS = ["Comune", "Elfico", "Gigante", "Gnomesco", "Goblin", "Halfling", "Nanico", "Orchesco", "Abissale", "Celestiale", "Draconico", "Infernale", "Silvano", "Sottocomune"];
    const CONDITIONS = ["Accecato", "Affascinato", "Afferrato", "Assordato", "Avvelenato", "Incapacitato", "Invisibile", "Paralizzato", "Pietrificato", "Prono", "Spaventato", "Stordito", "Trattenuto", "Indebolito"];

    const DICTIONARY = {
        "Orchesco": ["Grush", "nik", "terk", "ah", "nar", "bor", "zug"],
        "Elfico": ["Elia", "val", "shannar", "mora", "lyth", "ae"],
        "Nanico": ["Khazad", "dum", "baruk", "ai", "menu", "rok"],
        "Draconico": ["Vith", "dur", "darastrix", "ignis", "irlyth"],
        "Abissale": ["Gh’ul", "nak", "kazz", "shur", "t’ghul"],
        "Infernale": ["Xas", "vile", "mor", "druk", "zehl"],
        "Gigante": ["Thrym", "jotun", "haug", "stolt", "fisk"],
        "Gnomesco": ["Boddynock", "glitter", "zook", "turen", "wrenn"],
        "Goblin": ["Riz", "gark", "snut", "kol", "vark", "titch"],
        "Halfling": ["Meri", "pippin", "leaf", "tea", "hill", "burr"],
        "Celestiale": ["Aureos", "lux", "divin", "seraph", "ethereal"],
        "Silvano": ["Faen", "leaf", "moss", "glade", "whisper", "dew"],
        "Sottocomune": ["Zar", "drow", "under", "dark", "deep", "void"]
    };

    window.onload = () => {
        const langDiv = document.getElementById('lang-selection');
        const npcLangDiv = document.getElementById('npc-lang-selection');
        ALL_LANGS.forEach(l => {
            const checked = l === "Comune" ? "checked disabled" : "";
            // FIX: Allineamento e stile selezione lingue
            langDiv.innerHTML += `<label class="check-item"><input type="checkbox" class="lang-check" value="${l}" ${checked}> ${l}</label>`;
            npcLangDiv.innerHTML += `<label class="check-item"><input type="checkbox" class="npc-lang-check" value="${l}" ${l==="Comune"?"checked":""}> ${l}</label>`;
        });
        
        document.getElementById('npc-photo').onchange = async (e) => {
            if(e.target.files[0]) npcTempPhoto = await compressImg(e.target.files[0]);
        };

        loadVault();
        updateRecentUI();

        const savedSession = localStorage.getItem('taverna_active_session');
        if(savedSession) {
            const s = JSON.parse(savedSession);
            document.getElementById('user-name').value = s.name;
            document.getElementById('camp-code').value = s.code;
            document.getElementById('user-role').value = s.role;
            me = s;
            joinGame(true);
        }
    };

    function filterLangsBySender(choice) {
        const lSelect = document.getElementById('current-lang');
        lSelect.innerHTML = "";
        let availableLangs = [];
        if (choice === "MASTER") {
            availableLangs = ALL_LANGS;
        } else if (cachedNPCs[choice]) {
            availableLangs = cachedNPCs[choice].langs || ["Comune"];
        }
        availableLangs.forEach(l => {
            lSelect.innerHTML += `<option value="${l}">Lingua: ${l}</option>`;
        });
    }

    function openSpawnModal() {
        document.getElementById('modal-spawn').style.display = 'flex';
        npcTempPhoto = null;
    }
    function closeSpawnModal() { document.getElementById('modal-spawn').style.display = 'none'; }

    async function spawnNPC() {
        const name = document.getElementById('npc-name').value.trim();
        const title = document.getElementById('npc-title').value.trim();
        const type = document.getElementById('npc-type').value;
        const hp = parseInt(document.getElementById('npc-hp').value) || 10;
        const ac = parseInt(document.getElementById('npc-ac').value) || 10;
        const count = parseInt(document.getElementById('npc-count').value) || 1;
        const langs = Array.from(document.querySelectorAll('.npc-lang-check:checked')).map(c => c.value);

        if(!name) return alert("Inserisci un nome!");

        let finalPhoto = npcTempPhoto || "https://cdn-icons-png.flaticon.com/512/149/149071.png";

        for(let i=1; i<=count; i++) {
            const finalName = count > 1 ? `${name} ${i}` : name;
            campaignRef.child('players').child(finalName).set({
                name: finalName,
                photo: finalPhoto,
                type: type,
                info: title,
                hp: hp,
                hpMax: hp,
                ac: ac,
                init: 0,
                langs: langs,
                cond: ""
            });
        }
        closeSpawnModal();
    }

    function openInitModal() {
        const container = document.getElementById('init-list-container');
        container.innerHTML = "";
        Object.values(cachedNPCs).forEach(p => {
            container.innerHTML += `<div style="display:flex; align-items:center; gap:10px; margin-bottom:5px;">
                <span style="color:white; flex:1; font-size:0.9rem;">${p.name}</span>
                <input type="number" class="init-input" data-name="${p.name}" value="${p.init || 0}" style="width:60px; margin:0;">
            </div>`;
        });
        document.getElementById('modal-init').style.display = 'flex';
    }

    function confirmIniziativa() {
        document.querySelectorAll('.init-input').forEach(input => {
            const name = input.getAttribute('data-name');
            const val = parseInt(input.value) || 0;
            campaignRef.child('players').child(name).update({ init: val });
        });
        document.getElementById('modal-init').style.display = 'none';
        campaignRef.child('combat').update({ round: 1 });
    }

    function nextRound() {
        campaignRef.child('combat').child('round').transaction(r => (r || 0) + 1);
    }

    function endCombat() {
        if(confirm("Terminare il combattimento?")) {
            campaignRef.child('combat').update({ round: 0 });
            Object.keys(cachedNPCs).forEach(name => {
                campaignRef.child('players').child(name).update({ init: 0 });
            });
        }
    }

    function managePG(name) {
        if(me.role !== 'master') return;
        currentTargetPG = cachedNPCs[name];
        document.getElementById('manage-title').innerText = "Gestisci " + name;
        document.getElementById('manage-main-menu').classList.remove('hidden');
        document.getElementById('manage-action-input').classList.add('hidden');
        document.getElementById('manage-conditions-list').classList.add('hidden');
        document.getElementById('modal-manage').style.display = 'flex';
    }

    let currentActionType = "";
    function showManageAction(type) {
        currentActionType = type;
        document.getElementById('manage-main-menu').classList.add('hidden');
        if(type === 'CONDIZIONI') {
            const list = document.getElementById('manage-conditions-list');
            list.innerHTML = "";
            const activeConds = (currentTargetPG.cond || "").split(',').filter(x => x);
            CONDITIONS.forEach(c => {
                const isActive = activeConds.includes(c);
                list.innerHTML += `<div class="cond-list-item">
                    <span>${c}</span>
                    <button class="btn-taverna" style="padding:4px 8px; font-size:0.6rem; background:${isActive?'#b71c1c':'#2e7d32'}; color:white;" 
                        onclick="toggleCondition('${c}', ${isActive})">${isActive?'RIMUOVI':'AGGIUNGI'}</button>
                </div>`;
            });
            list.classList.remove('hidden');
        } else {
            document.getElementById('manage-action-input').classList.remove('hidden');
            document.getElementById('manage-value').value = "";
        }
    }

    // FIX: Aggiunto log automatico danni/cure in chat
    function applyManageAction() {
        const val = parseInt(document.getElementById('manage-value').value);
        if(!val || val <= 0) return;
        let newHP = currentTargetPG.hp;
        let logMsg = "";

        if(currentActionType === 'DANNI') {
            newHP = Math.max(0, currentTargetPG.hp - val);
            logMsg = `${currentTargetPG.name} subisce ${val} danni. PF Attuali: ${newHP}/${currentTargetPG.hpMax}`;
        } else if(currentActionType === 'GUARIGIONE') {
            newHP = Math.min(currentTargetPG.hpMax, currentTargetPG.hp + val);
            logMsg = `${currentTargetPG.name} recupera ${val} PF. PF Attuali: ${newHP}/${currentTargetPG.hpMax}`;
        }

        campaignRef.child('players').child(currentTargetPG.name).update({ hp: newHP });
        
        // Invia log in chat
        campaignRef.child('chat').push({
            sender: "SISTEMA",
            role: "master",
            text: logMsg,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            lang: "Comune",
            recipient: "ALL",
            photo: "https://cdn-icons-png.flaticon.com/512/149/149071.png"
        });

        closeManage();
    }

    function toggleCondition(c, isActive) {
        let conds = (currentTargetPG.cond || "").split(',').filter(x => x);
        if(isActive) conds = conds.filter(x => x !== c);
        else conds.push(c);
        campaignRef.child('players').child(currentTargetPG.name).update({ cond: conds.join(',') });
        showManageAction('CONDIZIONI');
    }

    function closeManage() { document.getElementById('modal-manage').style.display = 'none'; }

    async function joinGame(isAuto = false) {
        const name = document.getElementById('user-name').value.trim();
        const code = document.getElementById('camp-code').value.trim().toUpperCase();
        const photoFile = document.getElementById('user-photo').files[0];
        const role = document.getElementById('user-role').value;

        if(!name || !code) return alert("Inserisci Nome e Codice!");

        let photoUrl = me.photo;
        if(photoFile) photoUrl = await compressImg(photoFile);

        const selectedLangs = Array.from(document.querySelectorAll('.lang-check:checked')).map(c => c.value);

        me = { 
            name, 
            code, 
            role, 
            photo: photoUrl, 
            hp: parseInt(document.getElementById('p-hp').value) || 10,
            hpMax: parseInt(document.getElementById('p-hp').value) || 10,
            ac: parseInt(document.getElementById('p-ac').value) || 10,
            langs: selectedLangs,
            cond: ""
        };

        campaignRef = db.ref('campaigns/' + code);
        
        if(role === 'player') {
            campaignRef.child('players').child(name).update(me);
            campaignRef.child('players').child(name).onDisconnect().remove();
        } else {
            document.getElementById('master-panel').classList.remove('hidden');
            document.getElementById('master-only-ui').classList.remove('hidden');
        }

        document.getElementById('login-ui').style.display = 'none';
        document.getElementById('game-ui').style.display = 'flex';
        document.getElementById('display-name').innerText = name;
        document.getElementById('display-code').innerText = code;

        saveToVault(me);
        saveRecent(code);
        localStorage.setItem('taverna_active_session', JSON.stringify(me));

        if(firstLoad) {
            setupListeners();
            firstLoad = false;
        }
        
        filterLangsBySender("MASTER");
        document.getElementById('silent-wake-lock').play().catch(()=>{});
    }

    function setupListeners() {
        campaignRef.child('players').on('value', snap => {
            const players = snap.val() || {};
            cachedNPCs = players;
            const bar = document.getElementById('party-bar');
            const masterSelect = document.getElementById('sender-choice');
            const playerWhisper = document.getElementById('player-msg-recipient');
            const multiBox = document.getElementById('multi-selector');
            const currentSender = masterSelect.value;
            const currentRecip = playerWhisper.value;

            bar.innerHTML = "";
            masterSelect.innerHTML = '<option value="MASTER">Parla come: MASTER</option>';
            playerWhisper.innerHTML = '<option value="ALL">A: TUTTI</option>';
            multiBox.innerHTML = "";

            const sorted = Object.values(players).sort((a,b) => (b.init || 0) - (a.init || 0));

            sorted.forEach(p => {
                const isNPC = p.type === 'NPC' || p.type === 'BOSS';
                const isBoss = p.type === 'BOSS';
                const hpPerc = Math.max(0, (p.hp / p.hpMax) * 100);
                const hpCol = hpPerc > 50 ? '#4caf50' : (hpPerc > 20 ? '#ff9800' : '#f44336');

                const condHtml = (p.cond || "").split(',').filter(x=>x).map(c => `<span class="cond-badge">${c}</span>`).join('');

                bar.innerHTML += `
                    <div class="pg-tag ${isNPC?'npc-tag':''} ${isBoss?'boss-tag':''}" onclick="managePG('${p.name}')">
                        <div class="avatar-container">
                            <img src="${p.photo}" class="avatar-circle" style="filter: ${p.hp<=0?'grayscale(1)':'none'}">
                            <div class="hp-overlay" style="background: ${hpCol}; opacity: ${0.7 - (hpPerc/200)}"></div>
                        </div>
                        <div style="flex:1">
                            <div style="font-weight:bold; font-size:0.8rem;">${p.name} ${p.init > 0 ? ' (⚔️'+p.init+')' : ''}</div>
                            <div style="font-size:0.65rem; color:#444;">${p.info || ''}</div>
                            <div style="font-size:0.7rem; font-weight:bold;">PF: ${p.hp}/${p.hpMax} | CA: ${p.ac}</div>
                            <div>${condHtml}</div>
                        </div>
                    </div>
                `;

                if(isNPC) {
                    masterSelect.innerHTML += `<option value="${p.name}">Parla come: ${p.name}</option>`;
                }
                if(p.name !== me.name) {
                    playerWhisper.innerHTML += `<option value="${p.name}">Sussurra a: ${p.name}</option>`;
                    multiBox.innerHTML += `<label class="check-item"><input type="checkbox" class="multi-dest" value="${p.name}"> ${p.name}</label>`;
                }
            });
            masterSelect.value = currentSender;
            playerWhisper.value = currentRecip;
            if(me.role === 'player') document.getElementById('player-whisper-ui').classList.remove('hidden');
        });

        campaignRef.child('chat').limitToLast(30).on('child_added', snap => {
            const m = snap.val();
            if(m.recipient !== 'ALL' && m.recipient !== me.name && m.sender !== me.name && me.role !== 'master') {
                if(!m.recipient.includes(me.name)) return;
            }
            displayMsg(m);
        });

        campaignRef.child('combat').on('value', snap => {
            const c = snap.val() || { round: 0 };
            currentRound = c.round;
            const display = document.getElementById('round-display');
            display.innerText = c.round > 0 ? `ROUND: ${c.round}` : "";
            document.getElementById('btn-round').classList.toggle('hidden', c.round === 0);
        });
    }

    // FIX: Sfondo sussurri coordinato al colore del testo "sussurra"
    function displayMsg(m) {
        const flow = document.getElementById('chat-flow');
        const isWhisper = m.recipient !== 'ALL';
        const isFromMe = m.sender === me.name;
        
        let processedText = m.text;
        if(m.lang !== "Comune" && !me.langs.includes(m.lang) && me.role !== 'master') {
            processedText = scrambleText(m.text, m.lang);
        }

        const whisperLabel = isWhisper ? `<strong style="color:var(--amber);">[SUSSURRA]</strong> ` : "";
        const langLabel = m.lang !== "Comune" ? `<i style="color:var(--gold); font-size:0.75rem;">(${m.lang})</i> ` : "";
        
        // Colore sbiadito per lo sfondo del sussurro
        const bubbleBg = isWhisper ? 'rgba(255, 202, 40, 0.15)' : 'rgba(255,255,255,0.05)';
        const borderCol = isWhisper ? 'var(--amber)' : 'transparent';

        flow.innerHTML += `
            <div class="chat-bubble" style="justify-content: ${isFromMe?'flex-end':'flex-start'}">
                ${!isFromMe ? `<img src="${m.photo}" class="chat-avatar">` : ''}
                <div class="chat-text" style="border-left: 2px solid ${borderCol}; background: ${bubbleBg}">
                    <div style="font-weight:bold; color:var(--amber); font-size:0.75rem;">
                        ${m.sender} <span class="chat-time">${m.time}</span>
                    </div>
                    <div>${whisperLabel}${langLabel}${processedText}</div>
                </div>
            </div>
        `;
        flow.scrollTop = flow.scrollHeight;
    }

    function scrambleText(txt, lang) {
        const words = txt.split(' ');
        const dict = DICTIONARY[lang] || ["..."];
        return words.map(w => dict[Math.floor(Math.random() * dict.length)]).join(' ');
    }

    function sendMsg() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if(!text) return;

        let senderName = me.name;
        let senderPhoto = me.photo;
        let recipient = "ALL";

        if(me.role === 'master') {
            const choice = document.getElementById('sender-choice').value;
            if(choice !== "MASTER") {
                senderName = choice;
                senderPhoto = cachedNPCs[choice].photo;
            } else {
                senderName = "MASTER";
                senderPhoto = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
            }
            
            const rChoice = document.getElementById('msg-recipient').value;
            if(rChoice === "MULTI") {
                recipient = Array.from(document.querySelectorAll('.multi-dest:checked')).map(c => c.value);
                if(recipient.length === 0) recipient = "ALL";
            } else {
                recipient = rChoice;
            }
        } else {
            recipient = document.getElementById('player-msg-recipient').value;
        }

        campaignRef.child('chat').push({
            sender: senderName,
            role: me.role,
            text: text,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            lang: document.getElementById('current-lang').value,
            recipient: recipient,
            photo: senderPhoto
        });

        input.value = "";
    }

    function updateWhisperUI(val) {
        document.getElementById('multi-selector').style.display = (val === 'MULTI' ? 'block' : 'none');
    }

    function clearChat() {
        if(confirm("Vuoi pulire tutta la chat?")) campaignRef.child('chat').remove();
    }

    function exitTavern() {
        if(confirm("Vuoi uscire dalla locanda?")) {
            localStorage.removeItem('taverna_active_session');
            location.reload();
        }
    }

    function compressImg(file) {
        return new Promise(res => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = e => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const size = 120;
                    canvas.width = size; canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, size, size);
                    res(canvas.toDataURL('image/jpeg', 0.6));
                };
            };
        });
    }

    function saveToVault(data) {
        let v = JSON.parse(localStorage.getItem('dd_vault') || '[]');
        v = v.filter(x => x.name !== data.name);
        v.unshift(data);
        if(v.length > 8) v.pop();
        localStorage.setItem('dd_vault', JSON.stringify(v));
    }

    function loadVault() {
        const v = JSON.parse(localStorage.getItem('dd_vault') || '[]');
        const box = document.getElementById('pg-vault');
        box.innerHTML = "";
        v.forEach(p => {
            box.innerHTML += `
                <div class="vault-card" onclick="applyVault('${p.name}')">
                    <span class="del-vault" onclick="event.stopPropagation(); removeFromVault('${p.name}')">×</span>
                    <img src="${p.photo}">
                    <div>${p.name}</div>
                </div>`;
        });
    }

    function applyVault(name) {
        const v = JSON.parse(localStorage.getItem('dd_vault') || '[]');
        const p = v.find(x => x.name === name);
        if(p) {
            document.getElementById('user-name').value = p.name;
            document.getElementById('user-role').value = p.role;
            document.getElementById('p-hp').value = p.hpMax;
            document.getElementById('p-ac').value = p.ac;
            document.getElementById('p-extra').classList.toggle('hidden', p.role==='master');
        }
    }

    function removeFromVault(name) {
        let v = JSON.parse(localStorage.getItem('dd_vault') || '[]');
        v = v.filter(x => x.name !== name);
        localStorage.setItem('dd_vault', JSON.stringify(v));
        loadVault();
    }

    function saveRecent(code) {
        let r = JSON.parse(localStorage.getItem('recent_rooms') || '[]');
        r = r.filter(x => x !== code);
        r.unshift(code);
        if(r.length > 5) r.pop();
        localStorage.setItem('recent_rooms', JSON.stringify(r));
        updateRecentUI();
    }

    function updateRecentUI() {
        const r = JSON.parse(localStorage.getItem('recent_rooms') || '[]');
        const box = document.getElementById('recent-box');
        const list = document.getElementById('recent-list');
        if(r.length > 0) {
            box.classList.remove('hidden');
            list.innerHTML = `<div style="font-size:0.7rem; color:var(--gold); margin-bottom:5px;">Stanze recenti:</div>`;
            r.forEach(code => {
                list.innerHTML += `<span class="room-chip" onclick="document.getElementById('camp-code').value='${code}'">${code} 
                    <span class="del-room" onclick="event.stopPropagation(); removeRecent('${code}')">×</span></span>`;
            });
        } else { box.classList.add('hidden'); }
    }

    function removeRecent(code) {
        let r = JSON.parse(localStorage.getItem('recent_rooms') || '[]');
        r = r.filter(x => x !== code);
        localStorage.setItem('recent_rooms', JSON.stringify(r));
        updateRecentUI();
    }

    function openSettings() {
        document.getElementById('set-hp').value = me.hpMax;
        document.getElementById('set-ac').value = me.ac;
        document.getElementById('modal-settings').style.display = 'flex';
    }
    function closeSettings() { document.getElementById('modal-settings').style.display = 'none'; }
    function saveSettings() {
        const nhp = parseInt(document.getElementById('set-hp').value) || me.hpMax;
        const nac = parseInt(document.getElementById('set-ac').value) || me.ac;
        me.hpMax = nhp;
        me.hp = Math.min(me.hp, nhp);
        me.ac = nac;
        if(me.role === 'player') campaignRef.child('players').child(me.name).update({ hp: me.hp, hpMax: nhp, ac: nac });
        localStorage.setItem('taverna_active_session', JSON.stringify(me));
        closeSettings();
    }
</script>
